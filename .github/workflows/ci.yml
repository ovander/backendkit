name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.27.1 is the toolchain backendkit is built and tested with; 1.26.0
        # is the floor (go.mod's go line), the oldest Go an importer may use.
        go-version: ["1.27.1", "1.26.0"]

    # bff.PostgresStore is tested against a real PostgreSQL (its tests fail,
    # rather than skip, in CI when TEST_DATABASE_URL is missing).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backendkit
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: backendkit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backendkit" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://backendkit:ci-only@localhost:5432/backendkit_test?sslmode=disable
      # The floor job must really run on the floor: without this, the go
      # command would switch to the toolchain line (1.27.1).
      GOTOOLCHAIN: ${{ matrix.go-version == '1.26.0' && 'local' || 'auto' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # go.mod's Go (its toolchain line, or the go line when there is none —
      # go mod tidy drops a toolchain line equal to the go line) and this
      # workflow's Go must agree: fail loudly if they drift rather than test on
      # one Go and pin another.
      - name: Toolchain matches go.mod
        if: matrix.go-version != '1.26.0'
        run: |
          want=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' go.mod)
          got=$(go env GOVERSION)
          echo "go.mod toolchain: $want · CI: $got"
          test -n "$want" && test "$got" = "$want"

      # The floor job runs exactly go.mod's go line, so the line cannot drift
      # from what CI proves.
      - name: Floor matches go.mod's go line
        if: matrix.go-version == '1.26.0'
        run: |
          want=$(awk '/^go /{print "go"$2}' go.mod)
          got=$(go env GOVERSION)
          echo "go.mod go line: $want · CI: $got"
          test -n "$want" && test "$got" = "$want"

      - name: Verify go.sum is up to date
        run: |
          go mod tidy
          git diff --exit-code go.sum

      - name: Build (all packages)
        run: go build ./...

      - name: Run tests
        run: go test -race -count=1 -timeout=120s ./...

      - name: Vet
        run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          # Build golangci-lint with the job's Go toolchain (1.27.1). The prebuilt
          # release binaries are compiled with an older Go and refuse to lint a
          # module whose toolchain directive targets a newer Go ("the Go language
          # version used to build golangci-lint is lower than the targeted Go
          # version").
          install-mode: goinstall
          # Skip the action's `config verify` step: it fetches a JSON schema from
          # golangci-lint.run at runtime, which makes CI fail on transient network
          # timeouts unrelated to the code. Local `golangci-lint run` still
          # validates the config.
          verify: false

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      # Pinned, so a scanner release never changes the result unannounced. It
      # is built with the job's Go (1.27.1): a govulncheck built with an older
      # Go refuses a module targeting a newer one.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Run govulncheck
        run: govulncheck ./...

