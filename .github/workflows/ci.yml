name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27.1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # go.mod's toolchain line and this workflow's Go version must agree:
      # fail loudly if they drift rather than test on one Go and pin another.
      - name: Toolchain matches go.mod
        run: |
          want=$(awk '/^toolchain /{print $2}' go.mod)
          got=$(go env GOVERSION)
          echo "go.mod toolchain: $want · CI: $got"
          test -n "$want" && test "$got" = "$want"

      - name: Verify go.sum is up to date
        run: |
          go mod tidy
          git diff --exit-code go.sum

      - name: Build (all packages)
        run: go build ./...

      - name: Run tests
        run: go test -race -count=1 -timeout=120s ./...

      - name: Vet
        run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          # Build golangci-lint with the job's Go toolchain (1.27.1). The prebuilt
          # release binaries are compiled with an older Go and refuse to lint a
          # module whose toolchain directive targets a newer Go ("the Go language
          # version used to build golangci-lint is lower than the targeted Go
          # version").
          install-mode: goinstall
          # Skip the action's `config verify` step: it fetches a JSON schema from
          # golangci-lint.run at runtime, which makes CI fail on transient network
          # timeouts unrelated to the code. Local `golangci-lint run` still
          # validates the config.
          verify: false

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

