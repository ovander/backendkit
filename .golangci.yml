version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      # Test fixtures (e.g. httptest handlers) routinely ignore Write/Encode
      # errors; checking them adds noise without catching real bugs.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - goimports
